<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="tiverton-town-logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Division One South Results</title>
<style>
:root{
  --league-yellow:#f2c400;
  --tiverton:#7fc8f8;
  --axis-corner:#ff8c42;
  --auto-promotion:#9bd18b;
  --promotion-playoff:#9dc3e6;
  --relegation-playoff:#f4b183;
  --relegation:#f4a6a6;
  --grid:#333;
  --page:#f4f4f4;
}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:var(--page);color:#111}
header{background:linear-gradient(115deg,#111 0%,#242424 45%,#111 100%);padding:18px 24px;color:#fff;border-bottom:5px solid var(--league-yellow);position:relative;overflow:hidden}
header:after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 0 58%,rgba(242,196,0,.12) 58% 72%,transparent 72%);pointer-events:none}
.hero{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:110px 1fr 170px;align-items:center;gap:22px;position:relative;z-index:1}
.hero-logo{height:92px;max-width:160px;object-fit:contain;display:block;margin:auto;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.hero-league{width:160px;height:78px;object-fit:cover;object-position:center;background:#ed1c24;border:2px solid rgba(255,255,255,.65);border-radius:6px}
.hero-copy{text-align:left}.eyebrow{color:var(--league-yellow);font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
h1{margin:0;font-size:clamp(25px,3vw,38px);line-height:1.05}.subtitle{margin-top:6px;color:#ddd;font-size:14px}
#status{margin-top:9px;font-size:13px;color:#bbb}
.logo-fallback{display:none;font-weight:900;color:var(--league-yellow);text-align:center}

.toolbar{padding:12px 16px;background:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 1px 5px #aaa}
button,.filebtn{padding:9px 14px;border:1px solid #333;background:var(--league-yellow);font-weight:bold;cursor:pointer;font:inherit;color:#111;text-decoration:none;display:inline-block}
button.secondary,.filebtn.secondary{background:white}
input{padding:9px;width:min(260px,100%);border:1px solid #aaa}
.wrap{width:100%;overflow-x:auto;overflow-y:visible;padding:14px 12px 18px;-webkit-overflow-scrolling:touch}
#matrix{width:max-content;min-width:0;margin:0 auto}
#matrix table{table-layout:fixed;width:max-content;margin:0;border-collapse:collapse;background:white}
#matrix th,#matrix td{border:1px solid var(--grid);text-align:center;width:64px;min-width:64px;height:42px;padding:0 5px;white-space:nowrap}
#matrix th{background:var(--league-yellow);font-weight:800;position:sticky;top:0;z-index:5}
#matrix th:first-child{left:0;z-index:8}
#matrix td:first-child{background:var(--league-yellow);font-weight:800;position:sticky;left:0;z-index:4}
#matrix .tiv-axis{background:var(--tiverton)!important}
#matrix .axis-corner{background:var(--axis-corner)!important}
#matrix .diag{background:var(--league-yellow)}
#matrix .score{font-weight:bold;font-size:15px}
.muted{color:#666}
.small{font-size:12px}
#games,#league{max-width:1100px;margin:10px auto 30px;background:#fff;padding:15px;overflow-x:auto}
#games h2,#league h2{margin-top:0}
#games table,#league table{width:100%;min-width:620px;border-collapse:collapse;font-size:14px;background:#fff}
#games th,#games td,#league th,#league td{border:1px solid var(--grid);text-align:center;height:34px;padding:4px 8px;position:static}
#games th,#league th{background:var(--league-yellow);font-weight:800}
#league td:nth-child(2){text-align:left}
#league tr.auto-promotion td{background:var(--auto-promotion)}
#league tr.promotion-playoff td{background:var(--promotion-playoff)}
#league tr.relegation-playoff td{background:var(--relegation-playoff)}
#league tr.relegation td{background:var(--relegation)}
#league tr.tiv-row td{font-weight:800}
#league tr.tiv-row td:nth-child(2){background:var(--tiverton);box-shadow:inset 0 0 0 2px #2474a6}
#league .league-legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 10px;font-size:12px}
#league .league-legend span{display:inline-flex;align-items:center;gap:5px}
#league .league-legend i{display:inline-block;width:15px;height:15px;border:1px solid #777}
#league .league-legend .auto{background:var(--auto-promotion)}
#league .league-legend .toppo{background:var(--promotion-playoff)}
#league .league-legend .bottompo{background:var(--relegation-playoff)}
#league .league-legend .rel{background:var(--relegation)}
#league .source-note{margin-top:8px;font-size:12px;color:#666}
@media (max-width:700px){
  header{padding:12px 10px}.hero{grid-template-columns:70px 1fr;gap:12px}.hero-logo{height:64px}.hero-league{display:none}.hero-copy{text-align:left}.eyebrow{font-size:10px;letter-spacing:1.3px}.subtitle{font-size:12px}

  .toolbar{padding:10px}
  .wrap{padding:10px 6px 16px}
  #matrix th,#matrix td{width:56px;min-width:56px;height:38px;font-size:13px}
  #matrix .score{font-size:14px}
}
@media print{
  .toolbar,#games{display:none}
  header{padding:8px}
  .wrap{padding:0;overflow:visible}
  #matrix th,#matrix td{position:static}
}
</style>
</head>
<body>
<header>
<div class="hero">
  <div><img class="hero-logo" src="tiverton-town-logo.png" alt="Tiverton Town FC crest" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="logo-fallback">TIVERTON<br>TOWN FC</div></div>
  <div class="hero-copy"><div class="eyebrow">Tiverton Town • 2026/27</div><h1>Division One South Results Centre</h1><div class="subtitle">Fixtures matrix, results and live league table</div><div id="status">Waiting for results data…</div></div>
  <div><img class="hero-league" src="https://www.voicenewspapers.co.uk/tindle-static/image/2024/08/30/12/41/Untitled-design-119.jpeg?crop=752%3A500&amp;height=500&amp;width=752" alt="Pitching In Southern League" onerror="this.style.display='none'"></div>
</div>
</header>
<div class="toolbar">
<button onclick="location.reload()">Refresh display</button>
<button class="secondary" onclick="downloadCSV()">Download CSV</button>
<a class="filebtn secondary" href="SFL_Division_One_South_Matrix.xlsx">Open coloured Excel matrix</a>
<button class="secondary" onclick="downloadHTML()">Download HTML report</button>
<input id="filter" placeholder="Filter team..." oninput="render()">
</div>
<div class="wrap"><div id="matrix"></div></div>
<div id="games"></div>
<div id="league"></div>
<script src="data.js"></script>
<script>
let data=window.SFL_DATA||{teams:[],results:[],leagueTable:[],updated:"",codes:{}};
const TIVERTON='Tiverton Town';
function load(){
 if(!window.SFL_DATA || !data.teams.length){
   document.getElementById('status').textContent='No results data is available yet. The online updater will try again automatically.';
   return;
 }
 render();
}
function render(){
 const f=document.getElementById('filter').value.trim().toLowerCase();
 let teams=data.teams.filter(t=>!f||t.toLowerCase().includes(f)||(data.codes[t]||'').toLowerCase().includes(f));
 let res=data.results;
 let lookup={};
 res.forEach(x=>lookup[x.home+'|'+x.away]=x.score);
 let h='<table><tr><th class="axis-corner" title="Away / Home">A/H</th>'+teams.map(home=>'<th class="'+(home===TIVERTON?'tiv-axis':'')+'" title="Home: '+esc(home)+'">'+esc(data.codes[home])+'</th>').join('')+'</tr>';
 teams.forEach(away=>{
   h+='<tr><td class="'+(away===TIVERTON?'tiv-axis':'')+'" title="Away: '+esc(away)+'">'+esc(data.codes[away])+'</td>';
   teams.forEach(home=>{
      let v=lookup[home+'|'+away];
      h+='<td class="'+(home===away?'diag ':'')+(v?'score':'')+'">'+(v||'')+'</td>';
   });
   h+='</tr>';
 });
 h+='</table>';
 document.getElementById('matrix').innerHTML=h;
 document.getElementById('status').textContent='Last updated: '+(data.updated||'unknown')+' · '+data.results.length+' completed games';
 let rows=res.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'') || a.home.localeCompare(b.home) || a.away.localeCompare(b.away));
 document.getElementById('games').innerHTML='<h2>Extracted results</h2><table><tr><th>Date</th><th>Home</th><th>Score</th><th>Away</th></tr>'+ rows.map(x=>'<tr><td>'+esc(formatDate(x.date))+'</td><td>'+esc(x.home)+'</td><td><b>'+esc(x.score)+'</b></td><td>'+esc(x.away)+'</td></tr>').join('')+'</table>';
 const league=Array.isArray(data.leagueTable)?data.leagueTable:[];
 const leagueCount=league.length;
 function leagueClass(x){
   const pos=Number(x.pos)||0;
   let c='';
   if(pos===1) c='auto-promotion';
   else if(pos>=2 && pos<=5) c='promotion-playoff';
   else if(leagueCount>=4 && pos>=leagueCount-3 && pos<=leagueCount-2) c='relegation-playoff';
   else if(leagueCount>=2 && pos>=leagueCount-1) c='relegation';
   if(x.team===TIVERTON) c+=(c?' ':'')+'tiv-row';
   return c;
 }
 const legend='<div class="league-legend"><span><i class="auto"></i>Automatic promotion</span><span><i class="toppo"></i>Promotion play-offs</span><span><i class="bottompo"></i>Relegation play-offs</span><span><i class="rel"></i>Relegation</span></div>';
 document.getElementById('league').innerHTML='<h2>League table</h2>'+(league.length?legend+'<table><tr><th>Pos</th><th>Team</th><th>P</th><th>GD</th><th>Pts</th></tr>'+league.map(x=>'<tr class="'+leagueClass(x)+'"><td>'+esc(x.pos)+'</td><td>'+esc(x.team)+'</td><td>'+esc(x.p)+'</td><td>'+esc(x.gd)+'</td><td><b>'+esc(x.pts)+'</b></td></tr>').join('')+'</table><div class="source-note">Source: Tivvy Archive · updated automatically online</div>':'<div class="muted">League table is temporarily unavailable; the online updater will try again automatically.</div>');
}
function formatDate(s){
 if(!s) return '';
 const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
 return m ? m[3]+'/'+m[2]+'/'+m[1] : s;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function download(name,text,type){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function downloadCSV(){
 const teams=data.teams;
 const lookup={};
 data.results.forEach(x=>lookup[x.home+'|'+x.away]=x.score);
 const rows=[['A/H',...teams.map(t=>data.codes[t])]];
 teams.forEach(away=>{
   const row=[data.codes[away]];
   teams.forEach(home=>{
     const score=home===away?'':(lookup[home+'|'+away]||'');
     row.push(score ? '="'+score+'"' : '');
   });
   rows.push(row);
 });
 rows.push([]);
 rows.push(['League table']);
 rows.push(['Pos','Team','P','GD','Pts']);
 (data.leagueTable||[]).forEach(x=>rows.push([x.pos,x.team,x.p,x.gd,x.pts]));
 download('SFL_Division_One_South_Matrix.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv');
}
function downloadHTML(){
 download('SFL_Division_One_South_Results.html','<!doctype html><html><body>'+document.querySelector('header').outerHTML+document.getElementById('matrix').outerHTML+document.getElementById('games').outerHTML+document.getElementById('league').outerHTML+'</body></html>','text/html');
}
load();
</script>
</body></html>
